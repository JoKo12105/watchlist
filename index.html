<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Streamingfilter</title>
<meta name="theme-color" content="#c2410c">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="view.css">
</head>
<body>
<div class="wrap">
  <header class="head">
    <h1>Watchlist-<span>Streamingfilter</span></h1>
    <p class="stand" id="stand">Lade Daten …</p>
  </header>

  <section class="board" aria-label="Filter">
    <div class="seg" role="group" aria-label="Art des Angebots" id="seg">
      <button type="button" class="abo" data-type="flat" aria-pressed="true">Im Abo</button>
      <button type="button" class="pay" data-type="rent" aria-pressed="false">Leihen</button>
      <button type="button" class="pay" data-type="buy" aria-pressed="false">Kaufen</button>
    </div>
    <div class="chips" id="chips" aria-label="Quellen"></div>
    <div class="tools">
      <input type="search" id="q" placeholder="Titel suchen …" aria-label="Titel suchen">
      <select id="sort" aria-label="Sortierung">
        <option value="added">Zuletzt hinzugefügt</option>
        <option value="title">Titel A–Z</option>
        <option value="year-desc">Jahr, neueste zuerst</option>
        <option value="year-asc">Jahr, älteste zuerst</option>
        <option value="count">Meiste Angebote</option>
        <option value="lb">Letterboxd-Bewertung</option>
        <option value="imdb">IMDb-Bewertung</option>
        <option value="runtime">Laufzeit, kürzeste zuerst</option>
      </select>
    </div>
    <div class="tools">
      <label class="check"><input type="checkbox" id="showAll"> Auch Filme ohne Angebot</label>
      <button type="button" class="linkbtn" id="resetSel">Auswahl leeren</button>
    </div>
  </section>

  <section aria-live="polite">
    <div class="summary"><div><b id="cnt">0</b> <span id="cntTxt"></span></div></div>
    <div class="list" id="list"><div class="empty">Lade Daten …</div></div>
  </section>
</div>
<script src="view.js"></script>
</body>
</html>
